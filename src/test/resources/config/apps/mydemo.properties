# ---------------------------------------------------------------------------
# App profile: Sauce Labs "My Demo App" (React Native) — the business-flow target.
# Selected with -Dapp=mydemo. Android values verified against the downloaded APK manifest.
#
# The APK is ~32 MB and is NOT committed. Run scripts/fetch-apps.sh once before
# the regression suite; the framework fails with that instruction if it is missing.
# ---------------------------------------------------------------------------

app.display.name=My Demo App (RN)

android.app.path=apps/Android-MyDemoAppRN.apk
android.app.package=com.saucelabs.mydemoapp.rn
android.app.activity=.MainActivity
android.app.wait.activity=*

# TODO: unzip the iOS-Simulator release into src/test/resources/apps to enable iOS runs.
ios.app.path=apps/MyRNDemoApp.app
ios.app.bundle.id=com.saucelabs.mydemoapp.rn

# ---------------------------------------------------------------------------
# iOS defaults — configuration only. Not executed in this repo (no macOS runner).
# Kept in lockstep with android.properties so the driver layer stays platform-agnostic.
# ---------------------------------------------------------------------------

platform=ios
execution=local

# --- Appium server ---------------------------------------------------------
appium.server.url=http://127.0.0.1:4723
appium.server.reuse=false
appium.server.ip=127.0.0.1
appium.server.port=4723
appium.server.log.level=info
appium.server.log.file=target/logs/appium-server.log
appium.server.startup.timeout.seconds=90
appium.server.allow.insecure=

# --- Device ----------------------------------------------------------------
# TODO: pick a simulator from `xcrun simctl list devices available`.
device.name=iPhone 15
# TODO: match the installed runtime, e.g. 17.5.
platform.version=
# TODO: real-device UDID; blank targets a simulator.
udid=
wda.local.port=8100

# --- Application under test -------------------------------------------------
# ApiDemos has no iOS build, so the iOS default is the cross-platform demo app.
app=mydemo
app.no.reset=false
app.full.reset=false
auto.accept.alerts=true

# --- Test data --------------------------------------------------------------
testdata.dir=testdata
faker.locale=en-US
faker.seed=

# --- Timeouts ---------------------------------------------------------------
timeout.new.command.seconds=120
timeout.wda.launch.seconds=180
timeout.explicit.seconds=25
timeout.polling.ms=300

# --- Grid / cloud -----------------------------------------------------------
grid.url=http://127.0.0.1:4444/wd/hub
cloud.provider=browserstack
cloud.project.name=mobile-automation-framework
cloud.build.name=local-build
cloud.tunnel.enabled=false

# --- Optional features ------------------------------------------------------
# --- AI-assisted layer (opt-in, never influences pass/fail) -------------------
# Requires ANTHROPIC_API_KEY in the environment. With the flag off, or the key
# absent, every AI call is skipped silently and the run behaves exactly as before.
ai.enabled=false
ai.model=claude-opus-5
ai.effort=low
ai.max.tokens=2048
ai.timeout.seconds=45
ai.triage.enabled=true
ai.healing.enabled=true
# Retrying a model-suggested locator could turn a red test green. Off in CI.
ai.healing.apply=false
ai.healing.report=target/healing-report.json
ai.page.source.limit=12000
record.video.on.failure=false
retry.count=2

# ---------------------------------------------------------------------------
# Android defaults. Every key here is overridable with -Dkey=value.
# NOTHING SECRET GOES IN THIS FILE — credentials come from environment variables.
# ---------------------------------------------------------------------------

platform=android
execution=local

# --- Appium server ---------------------------------------------------------
appium.server.url=http://127.0.0.1:4723
# true  = attach to a server you started yourself (fastest local loop)
# false = AppiumServerManager spawns and owns the server for the run
appium.server.reuse=false
appium.server.ip=127.0.0.1
appium.server.port=4723
appium.server.log.level=info
appium.server.log.file=target/logs/appium-server.log
appium.server.startup.timeout.seconds=60
appium.server.allow.insecure=adb_shell

# --- Device ----------------------------------------------------------------
# TODO: replace with your emulator/device name (`adb devices -l`, or the AVD name).
device.name=Android Emulator
# TODO: set to the API level of your emulator, e.g. 14.0. Blank = let Appium decide.
platform.version=
# TODO: set when more than one device is attached (`adb devices`).
udid=
system.port=8200

# --- Application under test -------------------------------------------------
# Which file in config/apps/ describes the app. Override per run with -Dapp=mydemo,
# or per <test> block with a TestNG parameter.
app=apidemos
app.no.reset=false
app.full.reset=false
auto.grant.permissions=true

# --- Test data --------------------------------------------------------------
testdata.dir=testdata
faker.locale=en-US
# Set to a number to make generated data reproducible while debugging a failure.
faker.seed=

# --- Timeouts ---------------------------------------------------------------
timeout.new.command.seconds=120
timeout.adb.exec.ms=60000
timeout.uiautomator2.install.ms=120000
timeout.uiautomator2.launch.ms=60000
timeout.explicit.seconds=20
timeout.polling.ms=300

# --- Grid / cloud -----------------------------------------------------------
grid.url=http://127.0.0.1:4444/wd/hub
cloud.provider=browserstack
cloud.project.name=mobile-automation-framework
cloud.build.name=local-build
cloud.tunnel.enabled=false

# --- Optional features ------------------------------------------------------
# --- AI-assisted layer (opt-in, never influences pass/fail) -------------------
# Requires ANTHROPIC_API_KEY in the environment. With the flag off, or the key
# absent, every AI call is skipped silently and the run behaves exactly as before.
ai.enabled=false
ai.model=claude-opus-5
ai.effort=low
ai.max.tokens=2048
ai.timeout.seconds=45
ai.triage.enabled=true
ai.healing.enabled=true
# Retrying a model-suggested locator could turn a red test green. Off in CI.
ai.healing.apply=false
ai.healing.report=target/healing-report.json
ai.page.source.limit=12000
record.video.on.failure=false
retry.count=2
